<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="pillBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="pillWhite" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Nền bo góc tròn cho PWA icon -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Vòng tròn hào quang trắng sáng -->
  <circle cx="256" cy="256" r="190" fill="#FFFFFF" fill-opacity="0.15"/>
  <circle cx="256" cy="256" r="160" fill="#FFFFFF" fill-opacity="0.25"/>

  <!-- Dấu thập đỏ y tế nổi bật phía sau -->
  <g filter="url(#shadow)">
    <!-- Tròn trắng làm nền chữ thập -->
    <circle cx="256" cy="256" r="145" fill="#FFFFFF"/>
    <!-- Chữ thập đỏ lớn -->
    <path d="M 226 150 L 286 150 L 286 226 L 362 226 L 362 286 L 286 286 L 286 362 L 226 362 L 226 286 L 150 286 L 150 226 L 226 226 Z" fill="#EF4444" rx="8"/>
  </g>

  <!-- Viên thuốc Chibi nghiêng dễ thương ở góc dưới phải -->
  <g transform="translate(310, 310) rotate(-20)" filter="url(#shadow)">
    <!-- Nửa trên xanh dương -->
    <path d="M -35 -40 A 35 35 0 0 1 35 -40 L 35 0 L -35 0 Z" fill="url(#pillBlue)"/>
    <!-- Nửa dưới trắng -->
    <path d="M -35 0 L 35 0 L 35 40 A 35 35 0 0 1 -35 40 Z" fill="url(#pillWhite)"/>
    <!-- Mắt long lanh -->
    <circle cx="-14" cy="-5" r="5" fill="#1E293B"/>
    <circle cx="14" cy="-5" r="5" fill="#1E293B"/>
    <circle cx="-12" cy="-7" r="2" fill="#FFFFFF"/>
    <circle cx="16" cy="-7" r="2" fill="#FFFFFF"/>
    <!-- Má hồng -->
    <ellipse cx="-22" cy="5" rx="6" ry="3.5" fill="#FDA4AF"/>
    <ellipse cx="22" cy="5" rx="6" ry="3.5" fill="#FDA4AF"/>
    <!-- Nụ cười -->
    <path d="M -6 5 Q 0 12 6 5" stroke="#1E293B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
</svg>